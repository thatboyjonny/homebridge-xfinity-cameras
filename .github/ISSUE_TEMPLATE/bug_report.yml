name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your refresh token, PIN, or full config.json.** Logs from this plugin don't contain tokens,
        but double-check anything you paste.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Cameras, Live view, Motion, Security panel / sensors / lights (experimental), Sign-in / token, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Plugin log lines
      description: Lines tagged with your plugin's name from the Homebridge log, around the problem.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: xfh-doctor output (optional)
      description: Stop Homebridge, then run `xfh-doctor --storage /var/lib/homebridge`. The output has no tokens.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, Homebridge, Node.js, camera model (e.g. 1.0.0 / 2.4.0 / 22.12 / xCam2)
    validations:
      required: true
